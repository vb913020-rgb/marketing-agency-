<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18033E" />
      <stop offset="100%" stop-color="#0a011a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97101" />
      <stop offset="100%" stop-color="#ff9233" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#018B11" />
      <stop offset="100%" stop-color="#25d366" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#F97101" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- T Shape + AI Spark -->
  <path d="M 22 26 H 78 V 38 H 56 V 78 H 44 V 38 H 22 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
  <!-- AI Dot/Spark -->
  <circle cx="70" cy="65" r="7" fill="url(#greenGrad)" filter="url(#glow)"/>
  <path d="M 70 52 L 72 58 L 78 60 L 72 62 L 70 68 L 68 62 L 62 60 L 68 58 Z" fill="#FEFEFE"/>
</svg>
